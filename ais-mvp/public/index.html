<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Base Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.05em;
    }

    header .badge {
      background: #e94560;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Main Layout ── */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Section Titles ── */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 3px solid #e94560;
      display: inline-block;
    }

    /* ── Stats Bar ── */
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 10px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat-card .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: #e94560;
    }

    .stat-card .stat-label {
      font-size: 0.85rem;
      color: #777;
      margin-top: 0.25rem;
    }

    /* ── Orders Section ── */
    .orders-section {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }

    /* Orders rendered by script.js go here */
    #orders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      min-height: 120px;
    }

    /* Placeholder shown before JS populates the list */
    #orders:empty::before {
      content: "Loading orders…";
      color: #aaa;
      font-style: italic;
      grid-column: 1 / -1;
      padding: 2rem 0;
      text-align: center;
    }

    /* ── Order Card (default styling — script.js may override) ── */
    .order-card {
      background: #fafafa;
      border: 1px solid #e8e8e8;
      border-left: 5px solid #e94560;
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }

    .order-card.status-ready  { border-left-color: #2ecc71; }
    .order-card.status-prep   { border-left-color: #f39c12; }
    .order-card.status-new    { border-left-color: #e94560; }

    .order-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .order-card p {
      font-size: 0.875rem;
      color: #555;
      line-height: 1.5;
    }

    .order-card .order-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #999;
    }

    .order-card .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #e94560;
      color: #fff;
      text-transform: uppercase;
    }

    .order-card.status-ready .status-tag  { background: #2ecc71; }
    .order-card.status-prep  .status-tag  { background: #f39c12; }

    /* ── Footer ── */
    footer {
      background: #1a1a2e;
      color: #aaa;
      text-align: center;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
    }

    /* ── ElevenLabs Convai Widget Container ── */
    .convai-wrapper {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════ -->
  <header>
    <h1>🍽️ Chef Dashboard</h1>
    <span class="badge">Live Orders</span>
  </header>

  <!-- ══════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════ -->
  <main>

    <!-- Stats Bar -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="stat-new">0</div>
        <div class="stat-label">New Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-prep">0</div>
        <div class="stat-label">In Preparation</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-ready">0</div>
        <div class="stat-label">Ready to Serve</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">Total Today</div>
      </div>
    </div>

    <!-- Orders Section -->
    <div class="orders-section">
      <span class="section-title">Active Orders</span>

      <!--
        ╔══════════════════════════════════════╗
        ║  #orders — required by script.js     ║
        ║  script.js renders order cards here  ║
        ╚══════════════════════════════════════╝
      -->
      <div id="orders"></div>
    </div>

  </main>

  <!-- ══════════════════════════════════════════
       FOOTER
  ══════════════════════════════════════════ -->
  <footer>
    &copy; 2026 Chef Dashboard &mdash; Powered by your kitchen team
  </footer>

  <!-- ══════════════════════════════════════════
       ELEVENLABS CONVAI WIDGET
       Drop-in conversational AI assistant.
       Replace data-agent-id with your agent ID.
  ══════════════════════════════════════════ -->
  <div class="convai-wrapper">
    <elevenlabs-convai agent-id="YOUR_AGENT_ID_HERE"></elevenlabs-convai>
  </div>

  <!-- ElevenLabs Convai SDK (loads the custom element) -->
  <script
    src="https://unpkg.com/@elevenlabs/convai-widget/dist/convai-widget.js"
    type="module"
    defer
  ></script>

  <!-- Your existing application script -->
  <script src="script.js" defer></script>

</body>
</html>
