<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef Dashboard</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── Base Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.05em;
    }

    header .badge {
      background: #e94560;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Main Layout ── */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Section Titles ── */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 3px solid #e94560;
      display: inline-block;
    }

    /* ── Stats Bar ── */
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 140px;
      background: #fff;
      border-radius: 10px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat-card .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: #e94560;
    }

    .stat-card .stat-label {
      font-size: 0.85rem;
      color: #777;
      margin-top: 0.25rem;
    }

    /* ── Orders Section ── */
    .orders-section {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }

    #orders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      min-height: 120px;
    }

    #orders:empty::before {
      content: "Loading orders…";
      color: #aaa;
      font-style: italic;
      grid-column: 1 / -1;
      padding: 2rem 0;
      text-align: center;
    }

    /* ── Order Card ── */
    .order-card {
      background: #fafafa;
      border: 1px solid #e8e8e8;
      border-left: 5px solid #e94560;
      border-radius: 8px;
      padding: 1rem 1.2rem;
    }

    .order-card.status-ready  { border-left-color: #2ecc71; }
    .order-card.status-prep   { border-left-color: #f39c12; }
    .order-card.status-new    { border-left-color: #e94560; }

    .order-card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .order-card p {
      font-size: 0.875rem;
      color: #555;
      line-height: 1.5;
    }

    .order-card .order-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #999;
    }

    .order-card .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #e94560;
      color: #fff;
      text-transform: uppercase;
    }

    .order-card.status-ready .status-tag  { background: #2ecc71; }
    .order-card.status-prep  .status-tag  { background: #f39c12; }

    /* ── Action Buttons ── */
    .order-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 1rem;
    }

    .order-actions button {
      flex: 1;
      padding: 0.5rem 0.2rem;
      font-size: 0.76rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      letter-spacing: 0.02em;
      transition: background 0.2s, opacity 0.2s;
      opacity: 0.38;
    }

    .order-actions button.btn-active {
      opacity: 1;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.18);
    }

    .prep-btn          { background: #f39c12; }
    .ready-btn         { background: #3498db; }
    .complete-btn      { background: #2ecc71; }

    /* ── Completed Orders ── */
    .order-card.completed {
      opacity: 0.65;
      border-left-color: #95a5a6;
      background: #f0f0f0;
    }

    .completed-section {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 2rem;
    }

    .completed-section .section-title {
      border-bottom-color: #95a5a6;
      color: #555;
    }

    #completed-orders {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      min-height: 60px;
    }

    #completed-orders:empty::before {
      content: "No completed orders yet.";
      color: #bbb;
      font-style: italic;
      grid-column: 1 / -1;
      padding: 1.5rem 0;
      text-align: center;
    }

    /* ── Footer ── */
    footer {
      background: #1a1a2e;
      color: #aaa;
      text-align: center;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
    }

    /* ElevenLabs widget */
    elevenlabs-convai {
      z-index: 9999;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🍽️ Chef Dashboard</h1>
    <span class="badge">Live Orders</span>
  </header>

  <!-- MAIN -->
  <main>

    <!-- Stats Bar -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="stat-new">0</div>
        <div class="stat-label">New Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-prep">0</div>
        <div class="stat-label">In Preparation</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-ready">0</div>
        <div class="stat-label">Ready to Serve</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-total">0</div>
        <div class="stat-label">Total Today</div>
      </div>
    </div>

    <!-- Active Orders -->
    <div class="orders-section">
      <span class="section-title">Active Orders</span>
      <div id="orders"></div>
    </div>

    <!-- Completed Orders -->
    <div class="completed-section">
      <span class="section-title">✓ Completed Orders</span>
      <div id="completed-orders"></div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 Chef Dashboard — Powered by your kitchen team
  </footer>

  <!-- ElevenLabs Convai Widget -->
  <elevenlabs-convai agent-id="agent_1001m2e6k3s2emh820nrgz7c3ngz"></elevenlabs-convai>
  <script src="https://cdn.jsdelivr.net/npm/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

  <!-- App Script -->
  <script src="script.js" defer></script>

</body>
</html>
