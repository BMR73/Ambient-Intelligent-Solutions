<!DOCTYPE html>
<html>
<head>
  <title>AIS Chef Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>AIS Chef Order Dashboard</h1>
    <p class="subtitle">Ambient Intelligent Solutions</p>
  </header>

  <section class="latest-order-section">
    <h2>Latest Order</h2>
    <div id="latest-order" class="order-card empty">
      Waiting for orders...
    </div>
  </section>

  <section class="history-section">
    <h2>Order History</h2>
    <div id="order-history" class="history-list">
      <p class="empty-history">No orders yet.</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
