<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Display — AIS Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Kitchen Display — AIS Demo</h2>

        <!-- Multi-table container -->
        <div id="ordersContainer"></div>
    </div>

    <script>
        async function loadOrders() {
            try {
                const response = await fetch('/api/getOrders');
                const orders = await response.json();

                const container = document.getElementById("ordersContainer");
                container.innerHTML = "";

                // Loop through each table
                Object.keys(orders).forEach(tableNum => {
                    const order = orders[tableNum];

                    const box = document.createElement("div");
                    box.className = "order-box";

                    box.innerHTML = `
                        <div class="label">Waitstaff:</div>
                        <div>${order.waitstaff?.name || "—"} (${order.waitstaff?.id || "—"})</div>

                        <div class="label">Table:</div>
                        <div>${order.table?.number || "—"}</div>

                        <div class="label">Seat:</div>
                        <div>${order.table?.seat || "—"}</div>

                        <div class="label">Items:</div>
                        <div>
                            ${order.items?.map(i => i.name).join(", ") || "—"}
                        </div>

                        <div class="label">Modifiers:</div>
                        <div>
                            ${order.items?.map(i =>
                                i.modifiers?.length ? i.modifiers.join(", ") : "None"
                            ).join(" | ")}
                        </div>

                        <div class="status">${order.status || "—"}</div>
                    `;

                    container.appendChild(box);
                });

            } catch (err) {
                console.error("Error loading orders:", err);
            }
        }

        // Initial load
        loadOrders();

        // Auto-refresh every 5 seconds
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
