<!DOCTYPE html>
<html>
<head>
    <title>Kitchen Display</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .section { margin-bottom: 20px; }
        .label { font-weight: bold; }
        .item { margin-left: 10px; }
    </style>
</head>
<body>

<h2>Kitchen Display</h2>

<div class="section">
    <span class="label">Table:</span>
    <span id="tableNumber"></span>
</div>

<div class="section">
    <span class="label">Seat:</span>
    <span id="seatNumber"></span>
</div>

<div class="section">
    <span class="label">Items:</span>
    <div id="itemsList"></div>
</div>

<div class="section">
    <span class="label">Modifiers:</span>
    <div id="modifiersList"></div>
</div>

<div class="section">
    <span class="label">Status:</span>
    <span id="orderStatus"></span>
</div>

<script>
async function loadLatestOrder() {
    try {
        const response = await fetch("/api/getLatestOrder");
        const order = await response.json();
        updateChefScreen(order);
    } catch (err) {
        console.error("Failed to load order:", err);
    }
}

function updateChefScreen(order) {
    document.getElementById("tableNumber").innerText = order.table;
    document.getElementById("seatNumber").innerText = order.seat;

    document.getElementById("itemsList").innerHTML =
        order.items.map(i => `<div class="item">${i.name}</div>`).join("");

    document.getElementById("modifiersList").innerHTML =
        order.items.map(i =>
            i.modifiers.length > 0
                ? `<div class="item">${i.modifiers.join(", ")}</div>`
                : `<div class="item">None</div>`
        ).join("");

    document.getElementById("orderStatus").innerText = order.status;
}

// Initial load
loadLatestOrder();

// Auto-refresh every 5 seconds
setInterval(loadLatestOrder, 5000);
</script>

</body>
</html>
