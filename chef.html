<script>
async function loadLatestOrder() {
    try {
        const response = await fetch("/api/getLatestOrder");
        const order = await response.json();
        updateChefScreen(order);
    } catch (err) {
        console.error("Failed to load order:", err);
    }
}

// Update the chef screen with live data
function updateChefScreen(order) {
    document.getElementById("tableNumber").innerText = order.table.number;
    document.getElementById("seatNumber").innerText = order.table.seat;

    document.getElementById("itemsList").innerHTML =
        order.items.map(i => `<div class="item">${i.name}</div>`).join("");

    document.getElementById("modifiersList").innerHTML =
        order.items.map(i =>
            i.modifiers.length > 0
                ? `<div class="item">${i.modifiers.join(", ")}</div>`
                : `<div class="item">None</div>`
        ).join("");

    document.getElementById("orderStatus").innerText = order.status;
}

// Initial load
loadLatestOrder();

// Auto-refresh every 5 seconds
setInterval(loadLatestOrder, 5000);
</script>
