<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Display — AIS Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Kitchen Display — AIS Demo</h2>

        <div class="order-box" id="orderBox">

            <div class="label">Waitstaff Name:</div>
            <div id="waitstaffName">—</div>

            <div class="label">Waitstaff ID:</div>
            <div id="waitstaffId">—</div>

            <div class="label">Table Number:</div>
            <div id="tableNumber">—</div>

            <div class="label">Seat Number:</div>
            <div id="seatNumber">—</div>

            <div class="label">Items:</div>
            <div id="itemsList">—</div>

            <div class="label">Modifiers:</div>
            <div id="modifiersList">—</div>

            <div class="status" id="orderStatus">Waiting for order...</div>
        </div>
    </div>

    <script>
        async function loadOrder() {
            try {
                const response = await fetch('/api/getLatestOrder');
                const order = await response.json();

                // Waitstaff
                document.getElementById("waitstaffName").innerText =
                    order.waitstaff?.name || "—";

                document.getElementById("waitstaffId").innerText =
                    order.waitstaff?.id || "—";

                // Table + Seat
                document.getElementById("tableNumber").innerText =
                    order.table?.number || "—";

                document.getElementById("seatNumber").innerText =
                    order.table?.seat || "—";

                // Items
                document.getElementById("itemsList").innerHTML =
                    order.items?.map(i =>
                        `<div class="item">${i.name}</div>`
                    ).join("") || "—";

                // Modifiers
                document.getElementById("modifiersList").innerHTML =
                    order.items?.map(i =>
                        i.modifiers?.length
                            ? `<div class="item">${i.modifiers.join(", ")}</div>`
                            : `<div class="item">None</div>`
                    ).join("") || "—";

                // Status
                document.getElementById("orderStatus").innerText =
                    order.status || "—";

            } catch (err) {
                console.error("Error loading order:", err);
            }
        }

        // Initial load
        loadOrder();

        // Auto-refresh every 5 seconds
        setInterval(loadOrder, 5000);
    </script>
</body>
</html>
