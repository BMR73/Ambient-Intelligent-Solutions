name: Deploy Azure Functions (Node 22)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Zip project
        run: zip -r release.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp
          path: release.zip

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9688956B6AB0495D8F0DF9AB8D02C723 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D94A60A37012461BA0B311D1A3325425 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_250AE49E1AFE4F46810FDBB92649BDC8 }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ais-mvp-orders-api-v4
          package: release.zip
